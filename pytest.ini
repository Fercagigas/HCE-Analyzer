[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: tests sin red ni credenciales (fakes para todos los ports)
    contract: cada adapter cumple su port usando fakes o fixtures grabadas
    integration: requiere credenciales reales (HCE_RUN_INTEGRATION=1); se salta sin ellas
    security: controles de seguridad (scope, inyeccion, superficie de schemas, no exec)
    slow: tests lentos (deseleccionar con -m "not slow")

# Warning filters - suppress external library warnings
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:supabase.*
    ignore::DeprecationWarning:postgrest.*
    ignore:Using extra keyword arguments on `Field` is deprecated:DeprecationWarning
    ignore:The 'timeout' parameter is deprecated:DeprecationWarning
    ignore:The 'verify' parameter is deprecated:DeprecationWarning
    ignore::FutureWarning:pandas.*
    ignore::pytest.PytestUnraisableExceptionWarning

# Output settings
addopts = -v --tb=short --strict-markers

# Async mode
asyncio_mode = auto
